[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bovdb-ensemble-learning"
version = "0.1.0"
description = "Reproducible research infrastructure for multiscale BovDB classification"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "pyarrow>=15,<24",
  "scikit-learn>=1.4,<2",
  "xgboost>=2.0,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.8"]
deep = ["torch>=2.3"]

[project.scripts]
ensemble-b0 = "ensemble_learning.cli:main"
ensemble-walk-forward = "ensemble_learning.cli:walk_forward_main"
ensemble-neural-walk-forward = "ensemble_learning.cli:neural_walk_forward_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
